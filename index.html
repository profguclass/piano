<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6f5c">
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Piano Reader</title>
<style>
:root{color-scheme:only light;--ink:#1d2330;--muted:#667085;--line:#d9dee7;--bar:#f4f1ea;--paper:#fffdf8;--accent:#1f6f5c;--accent-ink:#fff;--hint:#f2b63d;--bad:#d64545;--you:#2f6fd6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;font:17px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bar);touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
button,.btn,input[type=number]{font:inherit;min-height:48px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:0 16px;cursor:pointer}
.btn{display:inline-flex;align-items:center}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;min-width:120px}
button:active,.btn:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,.btn:focus-within{outline:3px solid #8cc7b8;outline-offset:1px}
button:disabled{opacity:.45}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.seg button{border:0;border-radius:0;min-width:64px;padding:0 14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;font-weight:600}
.seg.dim{opacity:.5}
.tempo{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff}
.tempo button{border:0;min-width:48px;padding:0;font-size:22px}
.tempo b{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.tempo small{color:var(--muted);font-size:12px;margin-right:4px}
.grow{flex:1}
#midi{display:inline-flex;align-items:center;gap:8px;max-width:240px}
#midi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#midi i{width:12px;height:12px;border-radius:50%;background:#b8c0cc;flex:none}
#midi.on i{background:#2fb26a;box-shadow:0 0 0 3px #2fb26a33}
#more{font-size:22px;min-width:52px;padding:0}
#panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
#panel[hidden]{display:none}
#panel .grp{display:flex;align-items:center;gap:8px}
#panel .grp>span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=number]{width:64px;text-align:center;padding:0 4px;cursor:text}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
main{flex:1;overflow:auto;background:var(--paper);padding:4px 4px 40px;-webkit-overflow-scrolling:touch}
#wrap{position:relative;max-width:1600px;margin:0 auto}
#marks{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;width:0;height:0;transition:opacity .4s}
.mk .hd{position:absolute;border-radius:50%;transform:translate(0,-50%) rotate(-20deg)}
.mk .lg{position:absolute;height:2px;transform:translateY(-50%)}
.mk .ac{position:absolute;transform:translate(-100%,-55%);font-weight:700;line-height:1}
.mk .lb{position:absolute;transform:translateY(-50%);font:700 15px/1 system-ui,sans-serif;color:#fff;padding:4px 7px;border-radius:8px;white-space:nowrap}
.mk.fade{opacity:0}
footer{border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#status{font-size:15px;color:var(--muted);padding:0 4px 6px;min-height:24px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kb{position:relative;height:96px;display:flex;touch-action:none}
#kb[hidden]{display:none}
.w{flex:1;border:1px solid #9aa3b2;border-top:0;border-radius:0 0 5px 5px;background:#fff;margin-right:-1px}
.b{position:absolute;top:0;height:62%;background:#1d2330;border-radius:0 0 4px 4px;z-index:1}
.w.need,.b.need{background:var(--hint)}
.w.on,.b.on{background:var(--accent)}
.w.bad,.b.bad{background:var(--bad)}
@media (max-width:760px){button.primary{min-width:96px}.seg button{min-width:52px;padding:0 10px}.tempo small{display:none}}
@media (max-height:600px){#kb{height:64px}header{padding-top:4px;padding-bottom:4px}}
</style>
</head>
<body>
<header>
  <button id="play" class="primary">▶ Play</button>
  <button id="restart" aria-label="Back to start">⏮</button>
  <div class="seg" id="mode" role="group" aria-label="Mode">
    <button data-v="listen">Listen</button><button data-v="along">Play along</button><button data-v="wait">Wait for me</button></div>
  <div class="seg" id="hands" role="group" aria-label="Hands you play">
    <button data-v="left">Left</button><button data-v="both">Both</button><button data-v="right">Right</button></div>
  <div class="tempo"><button id="slower" aria-label="Slower">−</button><b id="bpmv">100</b><small>bpm</small><button id="faster" aria-label="Faster">+</button></div>
  <span class="grow"></span>
  <button id="midi"><i></i><span>Connect piano</span></button>
  <button id="more" aria-label="More settings" aria-expanded="false">⋯</button>
</header>
<div id="panel" hidden>
  <label class="btn">Open score<input id="file" type="file" accept=".musicxml,.xml,.mxl" hidden></label>
  <button id="sample">Sample: Ode to Joy</button>
  <div class="grp"><span>Note size</span><button id="zout" aria-label="Smaller notes">−</button><button id="zin" aria-label="Bigger notes">+</button></div>
  <div class="grp"><input id="loop" type="checkbox" aria-label="Repeat bars"><span>Repeat bars</span>
    <input id="from" type="number" min="1" value="1" aria-label="From bar"><span>to</span><input id="to" type="number" min="1" value="1" aria-label="To bar"></div>
  <div class="grp"><span>Sound from</span><div class="seg" id="sound" role="group" aria-label="Sound from">
    <button data-v="piano">Piano</button><button data-v="tablet">Tablet</button></div></div>
  <div class="grp"><input id="showkb" type="checkbox" aria-label="Show keyboard"><span>Keyboard</span></div>
  <button id="full">Full screen</button>
  <button id="install" hidden>Install app</button>
</div>
<main id="scroll"><div id="wrap"><div id="score"></div><div id="marks"></div></div></main>
<footer><div id="status">Loading…</div><div id="kb"></div></footer>

<script src="opensheetmusicdisplay.min.js"></script>
<script>
const SAMPLE = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<score-partwise version=\"3.1\">\n  <work><work-title>Ode to Joy</work-title></work>\n  <identification><creator type=\"composer\">Ludwig van Beethoven</creator></identification>\n  <part-list><score-part id=\"P1\"><part-name>Piano</part-name></score-part></part-list>\n  <part id=\"P1\">\n    <measure number=\"1\">\n      <attributes><divisions>2</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><staves>2</staves><clef number=\"1\"><sign>G</sign><line>2</line></clef><clef number=\"2\"><sign>F</sign><line>4</line></clef></attributes>\n      <direction placement=\"above\"><direction-type><metronome><beat-unit>quarter</beat-unit><per-minute>100</per-minute></metronome></direction-type><staff>1</staff><sound tempo=\"100\"/></direction>\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>F</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>G</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <backup><duration>8</duration></backup>\n      <note><pitch><step>C</step><octave>3</octave></pitch><duration>8</duration><voice>2</voice><type>whole</type><staff>2</staff></note>\n    </measure>\n    <measure number=\"2\">\n      <note><pitch><step>G</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>F</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>D</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <backup><duration>8</duration></backup>\n      <note><pitch><step>G</step><octave>2</octave></pitch><duration>8</duration><voice>2</voice><type>whole</type><staff>2</staff></note>\n    </measure>\n    <measure number=\"3\">\n      <note><pitch><step>C</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>C</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>D</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <backup><duration>8</duration></backup>\n      <note><pitch><step>C</step><octave>3</octave></pitch><duration>8</duration><voice>2</voice><type>whole</type><staff>2</staff></note>\n    </measure>\n    <measure number=\"4\">\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>3</duration><voice>1</voice><type>quarter</type><dot/><staff>1</staff></note>\n      <note><pitch><step>D</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice><type>eighth</type><staff>1</staff></note>\n      <note><pitch><step>D</step><octave>4</octave></pitch><duration>4</duration><voice>1</voice><type>half</type><staff>1</staff></note>\n      <backup><duration>8</duration></backup>\n      <note><pitch><step>G</step><octave>2</octave></pitch><duration>8</duration><voice>2</voice><type>whole</type><staff>2</staff></note>\n    </measure>\n    <measure number=\"5\">\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>F</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>G</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <backup><duration>8</duration></backup>\n      <note><pitch><step>C</step><octave>3</octave></pitch><duration>8</duration><voice>2</voice><type>whole</type><staff>2</staff></note>\n    </measure>\n    <measure number=\"6\">\n      <note><pitch><step>G</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>F</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>D</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <backup><duration>8</duration></backup>\n      <note><pitch><step>G</step><octave>2</octave></pitch><duration>8</duration><voice>2</voice><type>whole</type><staff>2</staff></note>\n    </measure>\n    <measure number=\"7\">\n      <note><pitch><step>C</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>C</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>D</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <note><pitch><step>E</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type><staff>1</staff></note>\n      <backup><duration>8</duration></backup>\n      <note><pitch><step>C</step><octave>3</octave></pitch><duration>8</duration><voice>2</voice><type>whole</type><staff>2</staff></note>\n    </measure>\n    <measure number=\"8\">\n      <note><pitch><step>D</step><octave>4</octave></pitch><duration>3</duration><voice>1</voice><type>quarter</type><dot/><staff>1</staff></note>\n      <note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice><type>eighth</type><staff>1</staff></note>\n      <note><pitch><step>C</step><octave>4</octave></pitch><duration>4</duration><voice>1</voice><type>half</type><staff>1</staff></note>\n      <backup><duration>8</duration></backup>\n      <note><pitch><step>G</step><octave>2</octave></pitch><duration>4</duration><voice>2</voice><type>half</type><staff>2</staff></note>\n      <note><pitch><step>C</step><octave>3</octave></pitch><duration>4</duration><voice>2</voice><type>half</type><staff>2</staff></note>\n      <barline location=\"right\"><bar-style>light-heavy</bar-style></barline>\n    </measure>\n  </part>\n</score-partwise>\n";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('pr.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pr.' + k, JSON.stringify(v)); } catch {} },
};
const S = Object.assign({bpm: 100, hands: 'both', mode: 'listen', zoom: 1, loop: false, kb: true, sound: 'piano'}, store.get('settings', {}));
const save = () => store.set('settings', S);
let osmd, steps = [], pos = 0, bars = 1, playing = false, timer = null, target = 0;
let actx = null, master = null, need = new Set(), hits = 0, misses = 0, lock = null, title = '';

const sec = whole => whole * 240 / S.bpm;
// "mine" = a note the learner plays; the app plays everything else
const mine = n => S.hands === 'both' || (S.hands === 'right' ? n.staff === 0 : n.staff >= 1);
const appPlays = n => S.mode === 'listen' || !mine(n);

/* ---------- sound ---------- */
// With a piano connected, the app's notes are sent to it and sound on the piano itself.
let midiOut = null, wave = null;
const sentAt = {};                       // when we last sent each note, to ignore a piano echoing it back
function tone(midi, dur, vel = 0.5) {
  if (midiOut && S.sound === 'piano') {
    const now = performance.now();
    try {
      midiOut.send([0x90, midi, Math.round(30 + vel * 70)]); sentAt[midi] = now;
      midiOut.send([0x80, midi, 0], now + Math.max(0.15, dur) * 950);
      return;
    } catch { midiOut = null; }
  }
  synth(midi, dur, vel);
}
function silence() { try { midiOut?.send([0xB0, 123, 0]); } catch {} }   // all notes off
function synth(midi, dur, vel) {         // soft piano-like tone: few harmonics, brightness fades like a struck string
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'balanced'});
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 20; comp.ratio.value = 3;
    master = actx.createGain(); master.gain.value = 0.7;
    master.connect(comp).connect(actx.destination);
    wave = actx.createPeriodicWave(new Float32Array(8), new Float32Array([0, 1, 0.42, 0.18, 0.09, 0.04, 0.02, 0.01]));
  }
  if (actx.state === 'suspended') actx.resume();
  const t = actx.currentTime + 0.02, f = 440 * 2 ** ((midi - 69) / 12), d = Math.max(0.2, dur);
  const decay = Math.min(1.6, Math.max(0.35, Math.sqrt(262 / f)));   // low notes ring longer
  const o = actx.createOscillator(), lp = actx.createBiquadFilter(), g = actx.createGain();
  o.setPeriodicWave(wave); o.frequency.value = f;
  lp.type = 'lowpass'; lp.Q.value = 0.3;
  lp.frequency.setValueAtTime(Math.min(8000, f * 8), t);
  lp.frequency.setTargetAtTime(Math.min(4000, f * 2.5), t, 0.25);
  o.connect(lp).connect(g).connect(master);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vel * 0.3, t + 0.006);
  g.gain.setTargetAtTime(0, t + 0.006, decay);
  g.gain.setTargetAtTime(0, t + d, 0.07);                            // release when the note ends
  o.start(t); o.stop(t + d + 0.5);
}
function accompany(st) { for (const n of st.notes) if (appPlays(n)) { tone(n.midi, sec(n.len)); flash(n.midi, 'on', Math.max(120, sec(n.len) * 900)); } }

/* ---------- note names ---------- */
const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const STEP = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];            // diatonic step of each pitch class (sharp spelling)
const FUND = {0: 0, 2: 1, 4: 2, 5: 3, 7: 4, 9: 5, 11: 6};    // OSMD NoteEnum -> diatonic step
const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
const diatonic = m => (Math.floor(m / 12) - 1) * 7 + STEP[m % 12];   // C4 = 28

/* ---------- reading the score into playable steps ---------- */
function buildSteps() {
  const c = osmd.cursor; steps = []; c.reset();
  let guard = 0;
  while (!c.Iterator.EndReached && guard++ < 20000) {
    const it = c.Iterator, notes = [];
    for (const ve of it.CurrentVoiceEntries || []) {
      if (ve.IsGrace) continue;
      for (const n of ve.Notes) {
        if (n.isRest()) continue;
        if (n.NoteTie && n.NoteTie.StartNote !== n) continue;       // tied continuation: already sounding
        const staff = n.ParentStaffEntry?.ParentStaff?.idInMusicSheet ?? 0;
        const len = n.NoteTie ? n.NoteTie.Duration.RealValue : n.Length.RealValue;
        const midi = n.halfTone + 12, p = n.Pitch;
        const dia = p && FUND[p.FundamentalNote] !== undefined ? (p.Octave + 3) * 7 + FUND[p.FundamentalNote] : diatonic(midi);
        notes.push({midi, len, staff, dia});
      }
    }
    steps.push({ts: it.CurrentEnrolledTimestamp.RealValue, bar: it.CurrentMeasureIndex, notes});
    c.next();
  }
  c.reset();
}
function stepDur(i) {
  if (i < steps.length - 1 && steps[i + 1].ts > steps[i].ts) return steps[i + 1].ts - steps[i].ts;
  return Math.max(0.25, ...steps[i].notes.map(n => n.len));
}
function range() {
  const last = steps.length - 1;
  if (!S.loop) return [0, last];
  let a = (+$('from').value || 1) - 1, b = (+$('to').value || bars) - 1;
  if (b < a) [a, b] = [b, a];
  const s = steps.findIndex(x => x.bar >= a && x.bar <= b);
  if (s < 0) return [0, last];
  let e = last; while (e > s && !(steps[e].bar >= a && steps[e].bar <= b)) e--;
  return [s, e];
}

/* ---------- cursor ---------- */
function gotoStep(i) {
  const c = osmd.cursor; c.hide(); c.reset();
  for (let k = 0; k < i; k++) c.next();
  c.show(); pos = i; follow(true); info();
}
function advance() { osmd.cursor.next(); pos++; follow(); info(); }
function follow(force) {
  const el = osmd.cursor.cursorElement, sc = $('scroll'); if (!el) return;
  const r = el.getBoundingClientRect(), v = sc.getBoundingClientRect();
  if (force || r.top < v.top + 10 || r.bottom > v.bottom - 10)
    sc.scrollTo({top: Math.max(0, sc.scrollTop + r.top - v.top - 40), behavior: 'smooth'});
}
function info(extra) {
  const st = steps[pos]; if (!st) return;
  let t = `${title ? title + ' · ' : ''}Bar ${st.bar + 1} of ${bars}`;
  if (S.loop) t += ` · Repeating ${$('from').value}–${$('to').value}`;
  if (S.mode !== 'listen' && (hits || misses)) t += ` · Correct ${hits} · Missed ${misses}`;
  $('status').textContent = extra ? `${t} · ${extra}` : t;
}

/* ---------- "you played" marks beside the cursor ---------- */
function staffFor(m) {
  const n = steps[0] ? Math.max(1, osmd.GraphicSheet.MeasureList[0]?.length || 1) : 1;
  if (n < 2 || S.hands === 'right') return 0;
  if (S.hands === 'left') return 1;
  return m >= 60 ? 0 : 1;
}
function mark(m, verdict, ref) {
  const cur = osmd?.cursor?.cursorElement, st = steps[pos], svg = $('score').querySelector('svg');
  if (!cur || !st || !svg || cur.style.display === 'none') return;
  const staff = ref ? ref.staff : staffFor(m);
  const gm = osmd.GraphicSheet.MeasureList[st.bar]?.[staff]; if (!gm) return;
  const clef = gm.InitiallyActiveClef, type = clef?.ClefType ?? 0;
  const line = clef?.Line || (type === 1 ? 4 : type === 2 ? 3 : 2);              // clef line, counted from the bottom
  const refDia = (type === 1 ? 24 : type === 2 ? 28 : 32) + (clef?.OctaveOffset || 0) * 7;   // F3 / C4 / G4
  const dia = ref ? ref.dia : diatonic(m);
  const off = (5 - line) - (dia - refDia) / 2;                                  // staff spaces below the top line
  const u = 10 * osmd.zoom, W = $('wrap').getBoundingClientRect(), G = svg.getBoundingClientRect(), C = cur.getBoundingClientRect();
  const x = C.right - W.left + u * 0.4, y = G.top - W.top + (gm.PositionAndShape.AbsolutePosition.y + off) * u;
  const col = verdict === 'ok' ? 'var(--accent)' : verdict === 'bad' ? 'var(--bad)' : 'var(--you)';

  $('marks').querySelector(`[data-m="${m}"]`)?.remove();
  const el = document.createElement('div'); el.className = 'mk'; el.dataset.m = m;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  const add = (cls, css, txt) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); if (txt) d.textContent = txt; el.append(d); };
  for (let l = Math.ceil(off) - (off < 0 ? 0 : 0); off < -0.5 && l <= -1; l++) if (l >= off - 0.01) add('lg', {left: -u * 0.35 + 'px', width: u * 2 + 'px', top: (l - off) * u + 'px', background: col});
  for (let l = 5; off > 4.5 && l <= off + 0.01; l++) add('lg', {left: -u * 0.35 + 'px', width: u * 2 + 'px', top: (l - off) * u + 'px', background: col});
  add('hd', {left: 0, width: u * 1.32 + 'px', height: u + 'px', background: col});
  if (!ref && STEP[m % 12] === STEP[(m + 11) % 12]) add('ac', {left: -u * 0.15 + 'px', fontSize: u * 1.6 + 'px', color: col}, '♯');
  add('lb', {left: u * 1.9 + 'px', background: col}, noteName(m) + (verdict === 'ok' ? ' ✓' : verdict === 'bad' ? ' ✗' : ''));
  $('marks').append(el);
  setTimeout(() => el.classList.add('fade'), 1100);
  setTimeout(() => el.remove(), 1600);
}
const clearMarks = () => { $('marks').innerHTML = ''; };

/* ---------- on-screen keyboard ---------- */
const isBlack = m => [1, 3, 6, 8, 10].includes(m % 12);
function buildKb() {
  const all = steps.flatMap(s => s.notes.map(n => n.midi));
  let lo = all.length ? Math.min(...all) : 48, hi = all.length ? Math.max(...all) : 83;
  lo = Math.floor(lo / 12) * 12; hi = Math.ceil((hi + 1) / 12) * 12 - 1;
  if (hi - lo < 23) hi = lo + 23;
  const kb = $('kb'); kb.innerHTML = '';
  const whites = []; for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
  const w = 100 / whites.length;
  whites.forEach(m => { const d = document.createElement('div'); d.className = 'w'; d.dataset.m = m; kb.append(d); });
  for (let m = lo; m <= hi; m++) if (isBlack(m)) {
    const d = document.createElement('div'); d.className = 'b'; d.dataset.m = m;
    d.style.width = w * 0.62 + '%'; d.style.left = (whites.indexOf(m - 1) + 1) * w - w * 0.31 + '%'; kb.append(d);
  }
}
const key = m => $('kb').querySelector(`[data-m="${m}"]`);
function flash(m, cls, ms) { const k = key(m); if (!k) return; k.classList.add(cls); setTimeout(() => k.classList.remove(cls), ms); }
function paintNeed() {
  $('kb').querySelectorAll('.need').forEach(k => k.classList.remove('need'));
  if (playing && S.mode === 'wait') need.forEach(m => key(m)?.classList.add('need'));
}

/* ---------- playback ---------- */
function setPlaying(on) { playing = on; $('play').textContent = on ? '❚❚ Pause' : '▶ Play'; }
function pause() { clearTimeout(timer); setPlaying(false); need.clear(); paintNeed(); silence(); }
function play() {
  if (!steps.length) return;
  const [s, e] = range();
  if (pos < s || pos > e || pos >= steps.length - 1 && !S.loop && pos !== 0) gotoStep(s);
  setPlaying(true); hits = misses = 0;
  if (S.mode === 'wait') prepWait(); else { target = performance.now(); tick(); }
}
function atEnd() {                       // returns true if playback should stop
  const [s, e] = range();
  if (pos < e) { advance(); return false; }
  if (S.loop) { gotoStep(s); return false; }
  pause(); gotoStep(0); info('Finished'); return true;
}
function tick() {                        // Listen and Play along: move at the set tempo
  if (!playing) return;
  const st = steps[pos];
  accompany(st);
  if (S.mode === 'along') for (const n of st.notes) if (mine(n)) flash(n.midi, 'need', Math.max(150, sec(n.len) * 900));
  target += sec(stepDur(pos)) * 1000;
  timer = setTimeout(() => { if (playing && !atEnd()) tick(); }, Math.max(0, target - performance.now()));
}
function prepWait() {                    // Wait for me: stop on each of your notes, play the other hand in time
  clearTimeout(timer);
  if (!playing) return;
  need = new Set(steps[pos].notes.filter(mine).map(n => n.midi));
  paintNeed();
  if (need.size) { info('Play the highlighted keys'); return; }
  accompany(steps[pos]);                 // nothing for you here: the app plays it, then moves on
  timer = setTimeout(() => { if (playing && !atEnd()) prepWait(); }, sec(stepDur(pos)) * 1000);
}
function expected(m) {                   // the score note this key matches, near the cursor
  const near = S.mode === 'along' && playing ? [pos, pos - 1, pos + 1] : [pos];
  for (const i of near) { const n = steps[i]?.notes.find(n => n.midi === m && (mine(n) || !playing)); if (n) return n; }
  return null;
}
function press(m, sound) {
  if (sound) tone(m, 0.6);
  const ref = expected(m);
  if (!playing || S.mode === 'listen') {
    mark(m, ref ? 'ok' : null, ref); flash(m, 'on', 180); info(`You played ${noteName(m)}`); return;
  }
  if (S.mode === 'along') {
    ref ? hits++ : misses++;
    mark(m, ref ? 'ok' : 'bad', ref); flash(m, ref ? 'on' : 'bad', 220); info(`You played ${noteName(m)}`); return;
  }
  if (need.has(m)) {
    mark(m, 'ok', ref);
    need.delete(m); hits++; flash(m, 'on', 220); key(m)?.classList.remove('need');
    if (!need.size) {
      accompany(steps[pos]);             // the app plays the other hand with your last note
      if (!atEnd()) prepWait();
    } else info('Play the highlighted keys');
  } else { misses++; mark(m, 'bad', null); flash(m, 'bad', 260); info(`You played ${noteName(m)} · Play the highlighted keys`); }
}

/* ---------- loading ---------- */
async function loadScore(data, name) {
  pause(); clearMarks(); $('status').textContent = 'Reading score…';
  try {
    await osmd.load(data); osmd.zoom = S.zoom; osmd.render();
    buildSteps();
    if (!steps.length) throw new Error('empty');
    bars = osmd.Sheet.SourceMeasures.length; title = osmd.Sheet.TitleString || name || '';
    const t = store.get('tempo:' + title, Math.round(osmd.Sheet.DefaultStartTempoInBpm || 0));
    if (t >= 30 && t <= 200) setBpm(t, false);
    $('from').max = $('to').max = bars; $('from').value = 1; $('to').value = Math.min(bars, 4);
    hits = misses = 0; buildKb(); osmd.cursor.show(); pos = 0; $('scroll').scrollTop = 0; info();
    return true;
  } catch (err) {
    console.error(err); steps = [];
    $('status').textContent = 'Could not read this file. Please choose a MusicXML score (.musicxml, .xml or .mxl).';
    return false;
  }
}

/* ---------- piano (MIDI) ---------- */
let midiAccess = null;
function pianoState(on, text) { $('midi').classList.toggle('on', on); $('midi').querySelector('span').textContent = text; }
function hookMidi() {
  const names = [], outs = [...midiAccess.outputs.values()];
  midiAccess.inputs.forEach(i => {
    names.push(i.name || 'Piano');
    i.onmidimessage = ev => {
      const [s, d1, d2] = ev.data;
      if ((s & 0xf0) !== 0x90 || d2 === 0) return;
      if (performance.now() - (sentAt[d1] || -1e9) < 150) return;   // the piano echoing a note the app sent
      press(d1, false);
    };
  });
  midiOut = outs.find(o => names.includes(o.name)) || outs[0] || null;
  pianoState(names.length > 0, names.length ? names[0] : 'Plug in piano');
}
async function connectMidi(auto) {
  if (!navigator.requestMIDIAccess) { if (!auto) pianoState(false, 'Use Chrome to connect'); return; }
  try {
    midiAccess = await navigator.requestMIDIAccess();
    store.set('midi', true); hookMidi(); midiAccess.onstatechange = hookMidi;
  } catch { if (!auto) pianoState(false, 'Piano link blocked'); }
}
async function autoConnect() {           // reconnect silently once the piano has been allowed before
  if (!store.get('midi', false) || !navigator.requestMIDIAccess) return;
  try { if ((await navigator.permissions.query({name: 'midi'})).state !== 'granted') return; } catch {}
  connectMidi(true);
}

/* ---------- screen, install, full screen ---------- */
async function keepAwake() {
  if (lock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
  try { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } catch {}
}
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('pointerdown', keepAwake);
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('install').hidden = false; });
$('install').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('install').hidden = true; };
const standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
$('full').hidden = standalone || !document.documentElement.requestFullscreen;
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- wiring ---------- */
function seg(id, k, after) {
  const el = $(id);
  const paint = () => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S[k]));
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; S[k] = b.dataset.v; paint(); save(); after(); };
  paint();
}
const dimHands = () => $('hands').classList.toggle('dim', S.mode === 'listen');
seg('mode', 'mode', () => { pause(); hits = misses = 0; dimHands(); info(S.mode === 'listen' ? 'The app plays both hands' : ''); });
seg('hands', 'hands', () => {
  if (S.mode === 'listen') info('Hands apply in Play along and Wait for me');
  else if (playing && S.mode === 'wait') prepWait();
});
dimHands();
seg('sound', 'sound', () => { silence(); info(S.sound === 'piano' && !midiOut ? 'Connect the piano to hear the app on it' : ''); });
function setBpm(v, remember = true) {
  S.bpm = Math.min(200, Math.max(30, v)); $('bpmv').textContent = S.bpm; save();
  if (remember && title) store.set('tempo:' + title, S.bpm);
}
$('slower').onclick = () => setBpm(S.bpm - 5);
$('faster').onclick = () => setBpm(S.bpm + 5);
setBpm(S.bpm, false);
$('play').onclick = () => playing ? pause() : play();
$('restart').onclick = () => { pause(); if (steps.length) gotoStep(range()[0]); };
$('more').onclick = () => { const p = $('panel'); p.hidden = !p.hidden; $('more').setAttribute('aria-expanded', !p.hidden); };
$('loop').checked = S.loop;
$('loop').onchange = e => { S.loop = e.target.checked; save(); info(); };
$('from').onchange = $('to').onchange = () => info();
$('showkb').checked = S.kb; $('kb').hidden = !S.kb;
$('showkb').onchange = e => { S.kb = e.target.checked; $('kb').hidden = !S.kb; save(); };
function zoom(d) {
  S.zoom = Math.min(2.2, Math.max(0.5, +(S.zoom + d).toFixed(2))); save();
  if (!steps.length) return; const was = playing; pause(); clearMarks();
  osmd.zoom = S.zoom; osmd.render(); gotoStep(pos); if (was) play();
}
$('zin').onclick = () => zoom(0.15); $('zout').onclick = () => zoom(-0.15);
$('sample').onclick = () => { store.set('score', null); loadScore(SAMPLE); $('panel').hidden = true; };
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    if (await loadScore(r.result, f.name.replace(/\.[^.]+$/, ''))) { store.set('score', {name: f.name, data: r.result}); $('panel').hidden = true; }
  };
  /\.mxl$/i.test(f.name) ? r.readAsBinaryString(f) : r.readAsText(f);
  e.target.value = '';
};
$('kb').addEventListener('pointerdown', e => { const m = e.target.dataset.m; if (m) { e.preventDefault(); press(+m, true); } });
$('midi').onclick = () => connectMidi(false);
addEventListener('resize', clearMarks);

osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay('score', {autoResize: true, backend: 'svg', drawTitle: true, drawPartNames: false, followCursor: false});
window._pr = {get steps() { return steps; }, get pos() { return pos; }, get playing() { return playing; }, press};
const saved = store.get('score', null);
(saved?.data ? loadScore(saved.data, saved.name.replace(/\.[^.]+$/, '')) : Promise.resolve(false)).then(ok => ok || loadScore(SAMPLE));
keepAwake(); autoConnect();
</script>
</body>
</html>
